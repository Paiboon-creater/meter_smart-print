<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTI PRINT // KITTY थीम</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Tom Select (Smart Dropdown) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <!-- QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

        :root {
            --bg-kitty: #ffe4e6; 
            --panel-bg: #ffffff; 
            --kitty-pink: #ff69b4; 
            --kitty-dark-pink: #d81b60; 
            --text-main: #4a4a4a; 
            --btn-pink: #ff69b4;
            --btn-pink-hover: #ff1493;
            --btn-mint: #2dd4bf;
            --btn-mint-hover: #14b8a6;
        }

        body {
            background-color: var(--bg-kitty);
            background-image: radial-gradient(#ffb6c1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            font-family: 'Kanit', 'Segoe UI', Tahoma, sans-serif;
            padding: 20px 0;
        }

        .container { max-width: 700px; margin-top: 2rem; }

        .card-stock {
            background-color: var(--panel-bg);
            border: 3px solid var(--kitty-pink);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0px 10px 25px rgba(255, 105, 180, 0.2);
        }

        .header-title {
            color: var(--kitty-dark-pink);
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(255, 105, 180, 0.3);
        }

        .ts-control, .ts-wrapper.single.input-active .ts-control {
            background-color: #ffffff !important;
            border: 2px solid var(--kitty-pink) !important;
            border-radius: 10px !important;
            padding: 12px 15px !important;
        }
        .ts-control > input { 
            color: #333333 !important; 
            font-size: 1.1rem; 
            font-family: 'Kanit', sans-serif;
        }
        .ts-control .item { 
            color: var(--kitty-dark-pink) !important; 
            font-size: 1.1rem; 
            font-weight: 600; 
        }
        .ts-dropdown { 
            background-color: #ffffff !important; 
            border: 2px solid var(--kitty-pink) !important; 
            border-radius: 0 0 10px 10px !important;
        }
        .ts-dropdown .option { 
            padding: 10px 15px; 
            color: var(--text-main) !important; 
            font-size: 1rem; 
            border-bottom: 1px dashed #ffe4e6;
        }
        .ts-dropdown .active, .ts-dropdown .option:hover { 
            background-color: #fff0f5 !important; 
            color: var(--kitty-dark-pink) !important; 
            font-weight: bold; 
        }

        .btn-cute-pink { background-color: var(--btn-pink); color: white; font-weight: 600; border: none; padding: 12px; font-size: 1.1rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3); transition: all 0.2s;}
        .btn-cute-pink:hover { background-color: var(--btn-pink-hover); color: white; transform: translateY(-2px); }
        .btn-cute-mint { background-color: var(--btn-mint); color: white; font-weight: 600; border: none; padding: 12px; font-size: 1.1rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(45, 212, 191, 0.3); transition: all 0.2s;}
        .btn-cute-mint:hover { background-color: var(--btn-mint-hover); color: white; transform: translateY(-2px); }

        #steps_checkbox_list {
            background-color: #fffafb;
            border: 2px dashed var(--kitty-pink);
            border-radius: 12px;
            max-height: 250px; 
            overflow-y: auto;
            padding: 15px;
        }

        .step-checkbox { width: 1.3rem; height: 1.3rem; cursor: pointer; accent-color: var(--kitty-pink); }
        .form-check-label { cursor: pointer; margin-left: 10px; font-size: 1.05rem; }

        .btn-outline-cute { border: 2px solid var(--kitty-pink); color: var(--kitty-dark-pink); border-radius: 8px;}
        .btn-outline-cute:hover { background-color: var(--kitty-pink); color: white; }
        
        .btn-clear { background-color: transparent; border: 1px solid #9ca3af; color: #6b7280; font-size: 0.85rem; border-radius: 6px; padding: 4px 10px; transition: 0.2s; }
        .btn-clear:hover { background-color: #f3f4f6; color: #374151; }

        /* ========================================================= */
        /* CSS พิมพ์เอกสาร A4 แนวนอน */
        /* ========================================================= */
        #printArea { display: none; }

        @media print {
            body > *:not(#printArea) { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            #printArea { display: block !important; position: relative; }
            #printArea * { visibility: visible; color: #000 !important; font-family: Tahoma, sans-serif !important; }
            @page { size: A4 landscape; margin: 0; }
        }

        .print-sheet-container {
            width: 297mm; height: 202mm; padding: 2mm 3mm; box-sizing: border-box;
            background: white; display: flex; justify-content: space-between;
            page-break-after: always; page-break-inside: avoid;
            color: #000; font-family: Tahoma, sans-serif; overflow: hidden;
        }

        .print-card {
            width: 48.6%; height: 100%; border: 1.5px solid #000;
            padding: 2mm 2.5mm; box-sizing: border-box;
            display: flex; flex-direction: column; background: #fff;
        }

        .print-header-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 3px; margin-bottom: 4px; }
        .print-title-area h3 { margin: 0 0 2px 0; font-size: 15px; text-align: center; font-weight: bold; }
        .print-meta-row { font-size: 12px; margin-bottom: 4px; display: flex; align-items: flex-end; gap: 4px; font-weight: bold; }
        .print-label { white-space: nowrap; margin-bottom: -1px; }
        .print-value { border-bottom: 1.5px dotted #000; padding-left: 5px; min-height: 15px; white-space: nowrap; overflow: hidden; }

        .print-qr-box { text-align: center; }
        .print-qr-box canvas, .print-qr-box img { width: 58px !important; height: 58px !important; margin: 0 auto; }
        .print-qr-box span { display: block; font-size: 9px; margin-top: 1px; font-weight: bold; }
        .print-code-text { font-size: 13px; font-weight: bold; letter-spacing: 1px; margin-top: 2px; }

        .table-wrapper { flex-grow: 1; display: flex; flex-direction: column; }
        
        /* การปรับแต่งตารางเพื่อล็อกความสูงแถวให้เท่ากันทุุกบรรทัด */
        .print-table { width: 100%; height: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; }
        .print-table tr { height: 4.34%; } /* บังคับความสูงเฉลี่ยให้เท่ากันหมด (100% / 23 แถว) */
        .print-table th, .print-table td { border: 1px solid #000; padding: 1px 2px; text-align: center; word-wrap: break-word; overflow: hidden; }
        .print-table th { background-color: #e0e0e0 !important; font-size: 10px; font-weight: bold; -webkit-print-color-adjust: exact; }
        .print-table td:first-child { white-space: nowrap; }
        
        .print-footer { display: flex; justify-content: space-between; font-size: 10px; margin-top: 4px; border-top: 1px solid #000; padding-top: 2px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- เพิ่มปุ่ม Home กลับหน้าหลักที่นี่ -->
    <div class="text-end mb-2">
        <a href="https://paiboon-creater.github.io/Data_Information_Jaguar_productions/" class="btn btn-outline-cute fw-bold px-3 text-decoration-none" style="background-color: white;">
            🏠 กลับหน้าหลัก
        </a>
    </div>

    <h3 class="text-center mb-4 header-title">🎀 ระบบพิมพ์ใบความก้าวหน้า 🐱</h3>
    
    <div class="card card-stock">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label mb-0" style="font-weight:600; color: var(--kitty-dark-pink);">🔍 1. ค้นหาและเลือกเลขที่ใบสั่ง</label>
            <button type="button" class="btn-clear" onclick="clearSelection()">🔄 เคลียร์ข้อมูล</button>
        </div>
        
        <select id="select_order" class="form-select mb-4" placeholder="พิมพ์ค้นหาใบสั่งงานตรงนี้เลย..."></select>
        
        <div id="step_info" class="mb-3" style="font-size: 1rem; font-weight: 600; color: var(--kitty-dark-pink); display: none;"></div>

        <!-- โซนเลือกขั้นตอน -->
        <div id="steps_selection_container" class="mb-4" style="display: none;">
            <label class="form-label" style="font-weight:600; color: var(--kitty-dark-pink);">🌸 2. เลือกขั้นตอนที่ต้องการพิมพ์</label>
            <div id="steps_checkbox_list" class="mb-3">
                <!-- เช็คบ็อกซ์จะถูกสร้างที่นี่ -->
            </div>
            <div>
                <button type="button" class="btn btn-sm btn-outline-cute fw-bold px-3" onclick="selectAllSteps(true)">☑️ เลือกทั้งหมด</button>
                <button type="button" class="btn btn-sm btn-outline-secondary fw-bold px-3 ms-2" onclick="selectAllSteps(false)">☐ ยกเลิกทั้งหมด</button>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-6">
                <button class="btn btn-cute-pink w-100" onclick="printSelectedSteps(false)">🖨️ พิมพ์ฟอร์มเปล่า</button>
            </div>
            <div class="col-6">
                <button class="btn btn-cute-mint w-100" onclick="printSelectedSteps(true)">🖨️ พิมพ์พร้อมประวัติ</button>
            </div>
        </div>
    </div>
</div>

<div id="printArea"></div>

<script>
    const BASE_URL = 'https://siiiifesdjuunwmwozfb.supabase.co/rest/v1';
    const SUPABASE_KEY = 'sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT';
    const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

    let globalData = { orders: [], works: [], targets: [], steps: [], employees: [], orderSteps: [] };
    let orderSelectInstance;

    const swalKitty = Swal.mixin({
        background: '#fff0f5',
        color: '#d81b60',
        confirmButtonColor: '#ff69b4',
        cancelButtonColor: '#9ca3af'
    });

    window.onload = async function() {
        swalKitty.fire({ title: 'กำลังโหลดข้อมูลน่ารักๆ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

        try {
            const [ordersRes, worksRes, targetsRes, stepsRes, empsRes, orderStepsRes] = await Promise.all([
                fetch(`${BASE_URL}/orders?select=id_order,order_no,id_work,start_date,end_date,quantity`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/work_items?select=id_work,work_code`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/targets?select=id_target,id_work,id_step,target_amount`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/production_steps?select=id_step,step_name`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/employees?select=id_name,name`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/order_steps?select=id_order,id_step,start_date,end_date`, { headers }).then(r => r.json())
            ]);

            globalData.orders = ordersRes.sort((a, b) => String(a.order_no || '').localeCompare(String(b.order_no || ''), 'th', { numeric: true }));
            globalData.works = worksRes;
            globalData.targets = targetsRes.sort((a,b) => parseInt(a.id_step) - parseInt(b.id_step));
            globalData.steps = stepsRes;
            globalData.employees = empsRes;
            globalData.orderSteps = orderStepsRes;

            const select = document.getElementById('select_order');
            select.innerHTML = `<option value="">-- พิมพ์ค้นหาใบสั่งงานตรงนี้ --</option>`;
            globalData.orders.forEach(o => {
                select.innerHTML += `<option value="${o.id_order}">${o.order_no}</option>`;
            });

            orderSelectInstance = new TomSelect("#select_order", {
                create: false,
                sortField: false,
                onChange: function(value) { showOrderInfo(value); }
            });

            Swal.close();
        } catch (error) {
            swalKitty.fire('Error', 'เชื่อมต่อฐานข้อมูลล้มเหลว', 'error');
        }
    };

    function clearSelection() {
        if (orderSelectInstance) {
            orderSelectInstance.clear();
        }
        document.getElementById('step_info').style.display = 'none';
        document.getElementById('steps_selection_container').style.display = 'none';
    }

    function showOrderInfo(orderId) {
        const infoDiv = document.getElementById('step_info');
        const stepsContainer = document.getElementById('steps_selection_container');
        const stepsList = document.getElementById('steps_checkbox_list');

        if (!orderId) {
            infoDiv.style.display = 'none';
            stepsContainer.style.display = 'none';
            return;
        }
        
        const order = globalData.orders.find(o => String(o.id_order) === String(orderId));
        if (order && order.id_work) {
            const targetsForOrder = globalData.targets
                .filter(t => String(t.id_work) === String(order.id_work))
                .sort((a,b) => parseInt(a.id_target) - parseInt(b.id_target));

            if (targetsForOrder.length > 0) {
                infoDiv.innerHTML = `✨ ใบสั่งงานนี้มีทั้งหมด <b>${targetsForOrder.length}</b> ขั้นตอนค่ะ`;
                infoDiv.style.display = 'block';
                
                let html = '';
                targetsForOrder.forEach((target, index) => {
                    const stepIndex = index + 1;
                    const printCode = String(order.id_order).padStart(3, '0') + String(stepIndex).padStart(2, '0');
                    const stepObj = globalData.steps.find(s => String(s.id_step) === String(target.id_step));
                    const stepNameText = stepObj ? stepObj.step_name : `ไม่ระบุชื่อขั้นตอน`;
                    
                    html += `
                    <div class="form-check mb-2">
                        <input class="form-check-input step-checkbox" type="checkbox" value="${target.id_target}" id="chk_step_${target.id_target}" checked>
                        <label class="form-check-label" style="color: #4a4a4a; font-weight: 600;" for="chk_step_${target.id_target}">
                            <span style="color:#d81b60; font-weight:bold; background: #fce4ec; padding: 2px 8px; border-radius: 6px;">[ ${printCode} ]</span> 🌸 ${stepNameText}
                        </label>
                    </div>
                    `;
                });
                stepsList.innerHTML = html;
                stepsContainer.style.display = 'block';
            } else {
                infoDiv.innerHTML = `❌ ไม่พบการตั้งค่าขั้นตอนทำงานสำหรับใบสั่งนี้`;
                infoDiv.style.display = 'block';
                stepsContainer.style.display = 'none';
            }
        } else {
            infoDiv.innerHTML = `❌ ใบสั่งงานนี้ยังไม่มีข้อมูลรหัสชิ้นงานในระบบ`;
            infoDiv.style.display = 'block';
            stepsContainer.style.display = 'none';
        }
    }

    function selectAllSteps(isSelect) {
        document.querySelectorAll('.step-checkbox').forEach(chk => {
            chk.checked = isSelect;
        });
    }

    async function printSelectedSteps(withData) {
        const orderId = document.getElementById('select_order').value;
        if (!orderId) {
            swalKitty.fire({icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาเลือกเลขที่ใบสั่งก่อนนะคะ'});
            return;
        }

        const orderObj = globalData.orders.find(o => String(o.id_order) === String(orderId));
        if (!orderObj || !orderObj.id_work) {
            swalKitty.fire({icon: 'error', title: 'ผิดพลาด', text: 'ใบสั่งนี้ไม่มีข้อมูลรหัสชิ้นงาน'});
            return;
        }

        const selectedTargetIds = Array.from(document.querySelectorAll('.step-checkbox:checked')).map(chk => chk.value);
        if (selectedTargetIds.length === 0) {
            swalKitty.fire({icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาติ๊กเลือกอย่างน้อย 1 ขั้นตอนเพื่อสั่งพิมพ์ค่ะ'});
            return;
        }

        const targetsForOrder = globalData.targets
            .filter(t => String(t.id_work) === String(orderObj.id_work))
            .sort((a,b) => parseInt(a.id_target) - parseInt(b.id_target));

        swalKitty.fire({ title: 'กำลังเตรียมข้อมูลพริ้นต์...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

        let historyData = [];
        if (withData) {
            try {
                const res = await fetch(`${BASE_URL}/daily_production?id_order=eq.${orderId}&order=record_date.asc`, { headers });
                if (res.ok) historyData = await res.json();
            } catch (e) {
                console.error("ดึงข้อมูลประวัติไม่สำเร็จ", e);
            }
        }

        const workObj = globalData.works.find(w => String(w.id_work) === String(orderObj.id_work));
        const workCodeText = workObj ? workObj.work_code : "-";
        const orderNo = orderObj.order_no || '-';
        const quantity = orderObj.quantity ? parseInt(orderObj.quantity).toLocaleString() + ' ชิ้น' : '-';
        const baseUrl = 'https://paiboon-creater.github.io/Data_Information_Jaguar_productions/daily_production.html';

        let allCardsHtml = [];

        targetsForOrder.forEach((target, index) => {
            if (!selectedTargetIds.includes(String(target.id_target))) {
                return; 
            }

            const stepIndex = index + 1;
            const printCode = String(orderObj.id_order).padStart(3, '0') + String(stepIndex).padStart(2, '0');

            const stepObj = globalData.steps.find(s => String(s.id_step) === String(target.id_step));
            const stepNameText = stepObj ? stepObj.step_name : "-";
            
            let stepStartDateStr = orderObj.start_date ? formatDateStr(orderObj.start_date) : "-";
            let stepEndDateStr = orderObj.end_date ? formatDateStr(orderObj.end_date) : "-";
            
            const orderStepObj = globalData.orderSteps.find(os => String(os.id_order) === String(orderId) && String(os.id_step) === String(target.id_step));
            if (orderStepObj) {
                if (orderStepObj.start_date) stepStartDateStr = formatDateStr(orderStepObj.start_date);
                if (orderStepObj.end_date) stepEndDateStr = formatDateStr(orderStepObj.end_date);
            }

            const currentUrl = `${baseUrl}?order_id=${encodeURIComponent(orderId)}&target_id=${encodeURIComponent(target.id_target)}`;

            let tableRowsHtml = '';
            let runningTotal = 0;
            const targetHistory = historyData.filter(h => String(h.id_target) === String(target.id_target));
            
            for(let i = 0; i < 22; i++) {
                if (i < targetHistory.length) {
                    const log = targetHistory[i];
                    let d = new Date(log.record_date);
                    let dateFormatted = !isNaN(d) ? `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear().toString().slice(-2)}` : '';
                    
                    const emp = globalData.employees.find(e => String(e.id_name) === String(log.id_name));
                    const empText = emp ? emp.name : '';
                    const produced = log.produced_amount || 0;
                    const ngAmt = log.nogoods_amount || 0;
                    const hWork = log.hour_work ? log.hour_work.toFixed(2) : ''; 
                    runningTotal += produced;

                    tableRowsHtml += `<tr>
                        <td>${dateFormatted}</td>
                        <td>&nbsp;</td>
                        <td>${produced.toLocaleString()}</td>
                        <td style="font-weight: bold;">${runningTotal.toLocaleString()}</td>
                        <td>${ngAmt > 0 ? ngAmt.toLocaleString() : '&nbsp;'}</td>
                        <td>${hWork}</td>
                        <td style="text-align: left; padding-left: 4px;">${empText}</td>
                        <td>${log.remark ? log.remark : '&nbsp;'}</td>
                    </tr>`;
                } else {
                    tableRowsHtml += `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
                }
            }

            allCardsHtml.push(`
                <div class="print-card">
                    <div class="print-header-top">
                        <div style="flex-grow: 1; overflow: hidden;">
                            <div class="print-title-area"><h3>ใบความก้าวหน้าของการผลิต</h3></div>
                            <div class="print-meta-row">
                                <span class="print-label">ใบสั่งงานเลขที่:</span> 
                                <span class="print-value" style="flex: 1.4;">${orderNo}</span>
                                <span class="print-label" style="margin-left: 12px;">ขั้นตอนงาน:</span> 
                                <span class="print-value" style="flex: 1.2;">${stepNameText}</span>
                            </div>
                            <div class="print-meta-row">
                                <span class="print-label">ชนิดงาน:</span> <span class="print-value" style="flex: 1;">${workCodeText}</span>
                            </div>
                            <div class="print-meta-row">
                                <span class="print-label">จำนวนชิ้นงานสั่งผลิต:</span> <span class="print-value">${quantity}</span>
                            </div>
                            <div class="print-meta-row">
                                <span class="print-label">วันที่เริ่ม:</span> <span class="print-value" style="flex: 1;">${stepStartDateStr}</span>
                                <span class="print-label" style="margin-left: 10px;">วันที่เสร็จ:</span> <span class="print-value" style="flex: 1;">${stepEndDateStr}</span>
                            </div>
                        </div>
                        <div class="print-qr-box">
                            <div class="qrcode-target" data-url="${currentUrl}"></div>
                            <span>สแกนเข้าสู่ขั้นตอน</span>
                            <div class="print-code-text">[ ${printCode} ]</div>
                        </div>
                    </div>
                    
                    <div class="table-wrapper">
                        <table class="print-table">
                            <thead>
                                <tr>
                                    <th width="12%">วันที่</th>
                                    <th width="11%">ตัวเลขตอนเลิกงาน</th>
                                    <th width="13%">ผลิตได้/วัน</th>
                                    <th width="14%">สะสม</th>
                                    <th width="8%">เสีย</th>
                                    <th width="9%">ชั่วโมง</th>
                                    <th width="18%">ชื่อคนทำ</th>
                                    <th width="15%">หมายเหตุ</th>
                                </tr>
                            </thead>
                            <tbody>${tableRowsHtml}</tbody>
                        </table>
                    </div>
                    
                    <div class="print-footer">
                        <span>F-PR-005-00</span>
                        <span>DAILY PRODUCTION TRACKER</span>
                    </div>
                </div>
            `);
        });

        let finalPagesHtml = '';
        for (let i = 0; i < allCardsHtml.length; i += 2) {
            let leftCard = allCardsHtml[i];
            let rightCard = allCardsHtml[i + 1] || `<div class="print-card" style="border:none;"></div>`;
            
            finalPagesHtml += `
                <div class="print-sheet-container">
                    ${leftCard}
                    ${rightCard}
                </div>
            `;
        }

        document.getElementById('printArea').innerHTML = finalPagesHtml;

        document.querySelectorAll('.qrcode-target').forEach(el => {
            el.innerHTML = "";
            new QRCode(el, {
                text: el.getAttribute('data-url'), width: 58, height: 58,
                colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
            });
        });

        Swal.close();

        setTimeout(() => {
            window.print();
        }, 500);
    }

    function formatDateStr(dateInput) {
        if (!dateInput) return '-';
        let d = new Date(dateInput);
        return !isNaN(d) ? `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}` : dateInput;
    }
</script>
</body>
</html>
